<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" width="880" height="496" role="img" aria-label="How a plugin runs: HolyArrs starts each plugin in its own sandbox and passes it its settings, its data folder and the folders you approve; the plugin sends back its log. With cgroups v2 it gets at most 512 MiB, 1 CPU, 256 processes and 1024 open files. Every web request goes through a proxy that lets through the websites the plugin lists, plus up to 100 you add. It calls HolyArrs only through the permissions you approve. Folders you did not approve, the HolyArrs database, other plugins and other websites stay out of reach.">
